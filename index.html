<html lang="he" dir="rtl">
<head>

  <title>המפל החי</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #071512;
    }
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .credit {
      position: fixed;
      bottom: 14px;
      left: 16px;
      direction: rtl;
      font: 12px/1.4 system-ui, sans-serif;
      color: rgba(255, 255, 255, 0.6);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
      pointer-events: none;
    }
  </style>

<body>
  <canvas id="view" aria-label="מפל ובריכה בצבע טורקיז ביער, בתנועה"></canvas>
  <div class="credit">צילום: Magnus D'Great M, Pexels</div>

  <!-- How the picture is drawn. One photo, drawn by the graphics card, so there are no layers and no cuts. -->
  <script id="fragment" type="x-shader/x-fragment">
    precision highp float;

    uniform sampler2D uPhoto;   // the photo
    uniform sampler2D uMap;     // red = how near, green = leaves, blue = waterfall
    uniform vec2  uRes;
    uniform vec2  uMouse;       // from -1 to 1
    uniform float uTime;
    uniform float uAspect;      // photo width / height

    float hash(vec2 p) {
      p = fract(p * vec2(123.34, 456.21));
      p += dot(p, p + 45.32);
      return fract(p.x * p.y);
    }

    // Smooth noise: soft blobs, never blocky
    float noise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      f = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
      float a = hash(i);
      float b = hash(i + vec2(1.0, 0.0));
      float c = hash(i + vec2(0.0, 1.0));
      float d = hash(i + vec2(1.0, 1.0));
      return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
    }

    void main() {
      float t = uTime;

      // Screen position, top left is (0,0)
      vec2 s = gl_FragCoord.xy / uRes;
      s.y = 1.0 - s.y;
      vec2 c = s - 0.5;

      // Camera turn: the side you look toward opens up a little
      c.y *= 1.0 + uMouse.x * c.x * 0.11;
      c.x *= 1.0 + uMouse.y * c.y * 0.11;

      // Fit the photo to the screen
      float screen = uRes.x / uRes.y;
      vec2 fit = screen > uAspect ? vec2(1.0, uAspect / screen) : vec2(screen / uAspect, 1.0);
      vec2 p = c * fit / 1.12 + vec2(0.5, 0.52) + uMouse * vec2(0.014, 0.010);

      // Depth: near things (the pool) move more than far things (the trees)
      float depth = texture2D(uMap, p).r;
      p += uMouse * (depth - 0.3) * vec2(0.075, 0.058);

      vec3 map = texture2D(uMap, p).rgb;
      float leaves = map.g;
      float fall   = map.b;
      float pool   = smoothstep(0.632, 0.69, p.y);

      // Wind in the leaves. Real wind does not roll like a wave:
      // a gust passes from left to right, branches lean a little with it,
      // and every small leaf trembles quickly at its own pace.
      // The gust rises and falls in time (it is not a wave rolling across the picture)
      float gust = 0.25 + 0.75 * smoothstep(0.3, 0.8, noise(vec2(t * 0.35, p.x * 0.8 + 2.0)));

      // The leaves are split into many small tufts. Each tuft moves as one stiff piece:
      // it turns a little and shakes at its own pace, and its edges stay pinned,
      // so nothing stretches or flows like water.
      vec2 windMove = vec2(0.0);
      float tremble = 0.0;
      for (int layer = 0; layer < 2; layer++) {
        float size = layer == 0 ? 0.021 : 0.034;
        vec2 grid = p * vec2(1.5, 1.0) / size + float(layer) * 7.37;
        vec2 cell = floor(grid);
        vec2 local = fract(grid) - 0.5;
        float r1 = hash(cell + 1.3);
        float r2 = hash(cell + 8.1);
        float pinned = smoothstep(0.5, 0.18, max(abs(local.x), abs(local.y)));
        float shake = sin(t * (5.0 + 7.0 * r1) + r2 * 6.283) * 0.65
                    + sin(t * (11.0 + 8.0 * r2) + r1 * 6.283) * 0.35;
        float angle = shake * gust * 0.20;
        vec2 turned = vec2(local.x * cos(angle) - local.y * sin(angle),
                           local.x * sin(angle) + local.y * cos(angle));
        vec2 move = (turned - local) + vec2(shake * 0.05 * gust, 0.0);
        windMove += move * pinned * size / vec2(1.5, 1.0);
        tremble += shake * pinned * 0.5;
      }
      vec2 q = p - windMove * leaves;

      // Ripples in the pool, stronger close to the viewer
      float near = clamp((p.y - 0.632) / 0.368, 0.0, 1.0);
      vec2 ripple = vec2(
        noise(vec2(p.x * 16.0, p.y * 70.0 - t * 0.55)) - 0.5,
        noise(vec2(p.x * 13.0 + 3.1, p.y * 55.0 - t * 0.42 + 7.3)) - 0.5
      );
      q += ripple * pool * (0.004 + 0.009 * near);

      // Where the waterfall meets the pool
      const float WATERLINE = 0.640;
      vec2 fromFall = vec2(max(abs(p.x - 0.51) - 0.07, 0.0), (p.y - WATERLINE) * 3.2);
      float away = length(fromFall);
      float reach = pool * exp(-away * 6.5);

      // Rings that spread out over the pool from the falling water
      float rings = sin(away * 140.0 - t * 5.0 + noise(p * 30.0) * 2.0);
      q += normalize(fromFall + 0.0001) * rings * reach * 0.0032;

      vec3 color = texture2D(uPhoto, q).rgb;

      // The fallen water glides away from the waterfall along the surface of the pool
      vec2 outward = normalize(vec2(sign(p.x - 0.51) * fromFall.x, (p.y - WATERLINE) * 1.6) + vec2(0.0, 0.0002));
      float glideZone = pool * exp(-away * 3.2);
      if (glideZone > 0.02) {
        float ga = fract(t * 0.33);
        float gb = fract(t * 0.33 + 0.5);
        float glideLen = 0.030;
        vec3 g1 = texture2D(uPhoto, q - outward * (ga - 0.5) * glideLen).rgb;
        vec3 g2 = texture2D(uPhoto, q - outward * (gb - 0.5) * glideLen).rgb;
        float gm = 1.0 - abs(1.0 - 2.0 * ga);
        color = mix(color, g1 * gm + g2 * (1.0 - gm), min(glideZone * 1.6, 1.0));
      }
      color += rings * reach * 0.045;

      // Leaves catch the light as they turn in the wind
      color *= 1.0 + leaves * gust * tremble * 0.09;

      // The waterfall: the water slides down in two waves that swap smoothly, so it never jumps
      if (fall > 0.003) {
        float len = 0.036;
        float a = fract(t * 0.42);
        float b = fract(t * 0.42 + 0.5);
        vec3 wa = texture2D(uPhoto, q - vec2(0.0, (a - 0.5) * len)).rgb;
        vec3 wb = texture2D(uPhoto, q - vec2(0.0, (b - 0.5) * len)).rgb;
        float mixA = 1.0 - abs(1.0 - 2.0 * a);
        vec3 water = wa * mixA + wb * (1.0 - mixA);

        // Falling water speeds up on the way down
        float drop = pow(max(p.y - 0.15, 0.0), 0.75) * 1.5;

        // Long soft strands of water falling at different speeds
        float strands =
            noise(vec2(p.x * 110.0, drop * 7.0 - t * 2.6)) * 0.6
          + noise(vec2(p.x * 190.0 + 9.0, drop * 12.0 - t * 3.6)) * 0.4;

        // Heavier sheets of water that come down in pulses, like a real fall
        float sheets = noise(vec2(p.x * 14.0, drop * 3.0 - t * 1.5));
        water *= 0.80 + 0.26 * strands + 0.16 * sheets;

        color = mix(color, water, fall);
      }

      // Thin veils of water that keep falling below the bright part, all the way into the pool
      float fallAbove = 0.0;
      float foot = 0.0;
      if (p.y > 0.25 && p.y < WATERLINE + 0.05) {
        for (int k = 1; k <= 6; k++) {
          fallAbove = max(fallAbove, texture2D(uMap, vec2(p.x, p.y - float(k) * 0.022)).b);
        }
        foot = max(texture2D(uMap, vec2(p.x, WATERLINE - 0.02)).b,
                   texture2D(uMap, vec2(p.x, WATERLINE - 0.05)).b);
        foot = max(foot, texture2D(uMap, vec2(p.x, WATERLINE - 0.09)).b);
      }
      float aboveWater = 1.0 - smoothstep(WATERLINE - 0.004, WATERLINE + 0.006, p.y);
      float veil = fallAbove * (1.0 - fall) * aboveWater;
      float dropV = pow(max(p.y - 0.15, 0.0), 0.75) * 1.5;
      float veilStrands =
          pow(noise(vec2(p.x * 150.0, dropV * 10.0 - t * 3.2)), 2.2) * 0.65
        + pow(noise(vec2(p.x * 260.0 + 4.0, dropV * 16.0 - t * 4.4)), 2.8) * 0.55;
      color += veil * veilStrands * 0.42 * vec3(0.92, 0.97, 1.0);

      // White churning foam exactly where the water lands
      float band = foot
        * smoothstep(WATERLINE - 0.024, WATERLINE - 0.002, p.y)
        * (1.0 - smoothstep(WATERLINE + 0.006, WATERLINE + 0.034, p.y));
      float churn =
          noise(vec2(p.x * 60.0 + t * 1.5, p.y * 90.0 - t * 2.0)) * 0.6
        + noise(vec2(p.x * 130.0 - t * 2.2, p.y * 160.0 + t * 1.2)) * 0.4;
      color = mix(color, vec3(0.95, 0.98, 0.99), band * smoothstep(0.30, 0.75, churn) * 0.8);

      // Mist that rises from the landing point
      float mistZone = foot
        * smoothstep(WATERLINE - 0.11, WATERLINE - 0.005, p.y)
        * (1.0 - smoothstep(WATERLINE, WATERLINE + 0.025, p.y));
      float puff = noise(vec2(p.x * 18.0 + t * 0.25, p.y * 22.0 + t * 0.7));
      color = mix(color, vec3(0.90, 0.96, 0.97), mistZone * puff * 0.30);

      // The crash: white water that leaps up in bursts where the fall hits the pool
      float burst = pow(noise(vec2(p.x * 26.0, t * 2.4)), 1.6);
      float leap = 0.010 + 0.034 * burst;
      float crash = foot
        * smoothstep(WATERLINE - leap, WATERLINE - leap * 0.35, p.y)
        * (1.0 - smoothstep(WATERLINE + 0.004, WATERLINE + 0.02, p.y));
      float crashGrain = noise(vec2(p.x * 180.0 + t * 3.0, p.y * 220.0 - t * 6.0));
      color = mix(color, vec3(0.97, 0.99, 1.0), crash * (0.45 + 0.4 * crashGrain));

      // Streaks of foam that slide outward with the stream, away from the fall
      float around = atan(fromFall.y, fromFall.x + 0.02) + p.x * 3.0;
      float streaks = noise(vec2(around * 11.0 + noise(p * 14.0) * 2.5, away * 26.0 - t * 1.0));
      float patches = noise(vec2(around * 9.0 + 5.0, away * 30.0 - t * 1.5));
      float foam = smoothstep(0.55, 0.85, streaks * 0.6 + patches * 0.4 + reach * 0.25);
      color = mix(color, vec3(0.93, 0.98, 0.98), min(reach * 1.5, 1.0) * foam * 0.36);

      // Drops of water thrown from the fall onto the rocks beside it
      if (p.x > 0.26 && p.x < 0.74 && p.y > 0.28 && p.y < 0.70) {
        float spray = 0.0;
        for (int i = 0; i < 34; i++) {
          float id = float(i);
          float rate = 0.7 + 0.6 * hash(vec2(id, 1.7));
          float clock = t * rate + hash(vec2(id, 9.2));
          float life = fract(clock);
          float round = floor(clock);
          float ra = hash(vec2(id + 0.5, round));
          float rb = hash(vec2(round, id + 3.1));
          float rc = hash(vec2(id + 7.7, round + 2.0));

          vec2 origin;
          vec2 speed;
          if (i < 12) {
            // Where the fall strikes the mossy rock half way down
            origin = vec2(0.445 + 0.03 * ra, 0.43 + 0.05 * rb);
            speed = vec2(-0.10 * rc - 0.01, -0.05 - 0.07 * ra);
          } else if (i < 20) {
            // The right side of the fall
            origin = vec2(0.575 + 0.02 * ra, 0.47 + 0.08 * rb);
            speed = vec2(0.08 * rc + 0.01, -0.04 - 0.06 * ra);
          } else {
            // The landing in the pool, thrown to both sides
            origin = vec2(0.41 + 0.20 * ra, WATERLINE - 0.006);
            speed = vec2((rb - 0.5) * 0.20, -0.07 - 0.10 * rc);
          }

          vec2 at = origin + vec2(speed.x * life, speed.y * life + 0.17 * life * life);
          float dotSize = 0.0011 + 0.0014 * rb;
          float dist = length((p - at) * vec2(1.5, 1.0));
          float fade = smoothstep(0.0, 0.08, life) * (1.0 - life);
          spray += smoothstep(dotSize, dotSize * 0.25, dist) * fade;
        }
        color += min(spray, 1.0) * 0.8 * vec3(0.94, 0.98, 1.0);
      }

      // Small glints of light on the pool
      float glint = noise(vec2(p.x * 90.0 + t * 0.3, p.y * 260.0 - t * 1.4));
      color += pool * pow(glint, 7.0) * 0.22;

      // Soft dark edges
      float edge = length(c * vec2(1.0, 1.15));
      color *= 1.0 - smoothstep(0.42, 0.85, edge) * 0.75;

      gl_FragColor = vec4(color, 1.0);
    }
  </script>

    const PHOTO_ASPECT = 1.5000;

    const canvas = document.getElementById('view');
    const gl = canvas.getContext('webgl', { antialias: false, alpha: false });

    function showStillPhoto() {
      // If the graphics card cannot draw, show the photo without motion
      canvas.style.display = 'none';
      document.body.style.background = `#071512 url(${PHOTO}) center / cover no-repeat`;
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    function makeTexture(unit, img) {
      const tex = gl.createTexture();
      gl.activeTexture(gl.TEXTURE0 + unit);
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    }

    function compile(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        throw new Error(gl.getShaderInfoLog(shader));
      }
      return shader;
    }

    async function start() {
      if (!gl) { showStillPhoto(); return; }

      const [photo, map] = await Promise.all([loadImage(PHOTO), loadImage(MAP)]);

      const program = gl.createProgram();
      gl.attachShader(program, compile(gl.VERTEX_SHADER,
        'attribute vec2 pos; void main() { gl_Position = vec4(pos, 0.0, 1.0); }'));
      gl.attachShader(program, compile(gl.FRAGMENT_SHADER,
        document.getElementById('fragment').textContent));
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        throw new Error(gl.getProgramInfoLog(program));
      }
      gl.useProgram(program);

      // One big triangle that covers the screen
      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      const pos = gl.getAttribLocation(program, 'pos');
      gl.enableVertexAttribArray(pos);
      gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);

      makeTexture(0, photo);
      makeTexture(1, map);
      gl.uniform1i(gl.getUniformLocation(program, 'uPhoto'), 0);
      gl.uniform1i(gl.getUniformLocation(program, 'uMap'), 1);
      gl.uniform1f(gl.getUniformLocation(program, 'uAspect'), PHOTO_ASPECT);
      const uRes   = gl.getUniformLocation(program, 'uRes');
      const uMouse = gl.getUniformLocation(program, 'uMouse');
      const uTime  = gl.getUniformLocation(program, 'uTime');

      // Where the camera wants to look, and where it looks now (from -1 to 1)
      let targetX = 0, targetY = 0;
      let x = 0, y = 0;

      window.addEventListener('pointermove', (e) => {
        targetX = (e.clientX / window.innerWidth) * 2 - 1;
        targetY = (e.clientY / window.innerHeight) * 2 - 1;
      });

      // On phones: follow the tilt of the device
      window.addEventListener('deviceorientation', (e) => {
        if (e.gamma == null || e.beta == null) return;
        targetX = Math.max(-1, Math.min(1, e.gamma / 30));
        targetY = Math.max(-1, Math.min(1, (e.beta - 45) / 30));
      });

      function resize() {
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        const w = Math.round(canvas.clientWidth * ratio);
        const h = Math.round(canvas.clientHeight * ratio);
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
          gl.viewport(0, 0, w, h);
        }
        gl.uniform2f(uRes, canvas.width, canvas.height);
      }

      function frame(time) {
        resize();
        // Soft, trailing camera
        x += (targetX - x) * 0.06;
        y += (targetY - y) * 0.06;
        gl.uniform2f(uMouse, x, y);
        gl.uniform1f(uTime, time / 1000);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    start().catch((err) => { console.error(err); showStillPhoto(); });
